openapi: 3.0.3
info:
  title: Famedly Managed Room API
  description: >
    API for creating and managing Famedly managed rooms.
  version: "0.0.4"
servers:
  - url: https://example.com
paths:
  /_famedlyControl/v1/managedRooms/createRoom:
    post:
      operationId: createManagedRoom
      summary: Create a managed room.
      description: >
        Creates a new non-federated, invite-only room with restricted power levels.
        Membership is managed by the group assignment and manual membership changes are forbidden.
        The creator is identified by the access token and assigned the highest power level.
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                room_alias_name:
                  type: string
                  description: The room alias localpart.
                name:
                  type: string
                  description: The name of the room.
                topic:
                  type: string
                  description: The topic for the room.
                creation_content:
                  type: object
                  description: Overridden to ensure federation is disabled.
                initial_state:
                  type: array
                  description: >
                    Initial state events. Join rules and guest access are forced
                    to 'invite' and 'forbidden' respectively.
                  items:
                    type: object
                    required: [type, content]
                    properties:
                      type: { type: string }
                      content: { type: object }
                power_level_content_override:
                  type: object
                  description: >
                    The power level content to override in the default power level event.
                room_version:
                  type: string
                  description: The room version to use.
                groups:
                  type: array
                  description: >
                    List of group IDs to be stored in the de.famedly.managedRoom account data.
                  items:
                    type: string
              example:
                name: "Managed Project"
                room_alias_name: "Super Project"
                topic: "Important discussion"
                groups: ["group1", "group2"]
      responses:
        "200":
          description: Room created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomGroupsResult"
        "400":
          description: >
            The request is invalid. `errcode` is `M_BAD_JSON` when the body fails
            validation, or `M_UNSUPPORTED_ROOM_VERSION` for an unknown room version.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      de.famedly.details:
                        $ref: "#/components/schemas/ValidationDetails"
        "403":
          description: Forbidden. User is not administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >
            The managed room could not be created. Either fetching the group members
            failed, or assigning them failed and the partially created room was rolled
            back.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      de.famedly.groups:
                        $ref: "#/components/schemas/GroupList"
                      room_id:
                        type: string
                        description: >
                          Present only when a created room could not be cleaned up
                          during rollback and may require manual intervention.
                        example: "!sefiuhWgwghwWgh:example.com"

  /_famedlyControl/v1/managedRooms/rooms:
    get:
      operationId: listManagedRooms
      summary: List managed rooms.
      description: >
        Returns a list of all rooms marked with `de.famedly.managedRoom` account data.
        This endpoint is restricted to administrators.
      security:
        - accessToken: []
      parameters:
        - in: query
          name: from
          schema:
            type: string
          description: The token to start returning results from.
        - in: query
          name: limit
          schema:
            type: integer
          description: The maximum number of results to return.
        - in: query
          name: search_term
          schema:
            type: string
          description: >
            Filter rooms by room ID, name, or canonical alias.
            Room ID matching is case-sensitive and full match.
            Name and canonical alias matching is case-insensitive and substring match.
            Only one search term is supported at a time.
        - in: query
          name: managed_room_group_id
          schema:
            type: string
          description: >
            Filter rooms by a specific group ID present in the managed room account data.
            Only one group ID is supported at a time.
        - in: query
          name: order_by
          schema:
            type: string
            enum:
              - name
              - canonical_alias
              - joined_members
              - joined_local_members
              - guest_access
              - history_visibility
              - join_rules
              - encryption
              - federatable
              - public
              - state_events
              - version
              - creator
            default: name
          description: The field to order results by.
        - in: query
          name: dir
          schema:
            type: string
            enum: [f, b]
            default: f
          description: Sort direction. 'f' for ascending (forward), 'b' for descending (backward).
      responses:
        "200":
          description: A list of managed rooms.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chunk:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManagedRoomChunk"
                  next_batch:
                    type: string
                    description: A pagination token for the response. The absence of this token means there are no more results to fetch and the client should stop paginating.
                  prev_batch:
                    type: string
                    description: A pagination token that allows fetching previous results. The absence of this token means there are no results before this batch, i.e. this is the first batch.
                  total_room_count_estimate:
                    type: integer
        "400":
          description: Invalid query parameter. Returned when `order_by` or `dir` have an unrecognised value, or `from` is not a valid integer.
        "401":
          description: Invalid or missing access token.
        "403":
          description: Forbidden. User is not administrator.

  /_famedlyControl/v1/managedRooms/{roomId}:
    get:
      operationId: getManagedRoom
      summary: Get a single managed room.
      description: >
        Returns the managed room marked with `de.famedly.managedRoom` account data,
        including the groups assigned to it.
      security:
        - accessToken: []
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
          description: The ID of the managed room to fetch.
      responses:
        "200":
          description: The managed room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedRoomChunk"
        "400":
          description: Malformed room ID.
        "401":
          description: Invalid or missing access token.
        "403":
          description: Forbidden. User is not administrator.
        "404":
          description: Room not found or not a managed room.

  /_famedlyControl/v1/managedRooms/{roomId}/groups:
    post:
      operationId: updateManagedRoomGroups
      summary: Update groups assigned to a managed room.
      description: >
        Updates the list of groups assigned to a specific managed room.
      security:
        - accessToken: []
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
          description: The ID of the managed room to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groups]
              properties:
                groups:
                  type: array
                  description: The new list of group IDs for this room.
                  items:
                    type: string
      responses:
        "200":
          description: Group membership updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomGroupsResult"
        "400":
          description: The request body is invalid. `errcode` is `M_BAD_JSON`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      de.famedly.details:
                        $ref: "#/components/schemas/ValidationDetails"
        "403":
          description: Forbidden. User is not administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Room not found or not a managed room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >
            Assigning group members failed. Includes the affected room and groups.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      room_id:
                        type: string
                        example: "!sefiuhWgwghwWgh:example.com"
                      de.famedly.groups:
                        $ref: "#/components/schemas/GroupList"

components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      description: >
        Standard Matrix-style error response. Any Famedly-specific context is returned
        under `de.famedly.*` keys alongside `errcode` and `error`.
      required: [errcode, error]
      properties:
        errcode:
          type: string
          description: Machine-readable error code, e.g. `M_BAD_JSON`.
          example: "M_BAD_JSON"
        error:
          type: string
          description: Human-readable error message.
          example: "Invalid request body"
    ValidationDetails:
      type: array
      description: >
        Per-field validation failures, returned as `de.famedly.details` when the
        request body fails validation.
      items:
        type: object
        properties:
          loc:
            type: array
            description: Path to the invalid field.
            items:
              type: string
          msg:
            type: string
            description: Description of why the field is invalid.
      example:
        - loc: ["groups"]
          msg: "Input should be a valid list"
    RoomGroupsResult:
      type: object
      description: The room and the groups now assigned to it.
      required: [room_id, "de.famedly.groups"]
      properties:
        room_id:
          type: string
          example: "!sefiuhWgwghwWgh:example.com"
        de.famedly.groups:
          $ref: "#/components/schemas/GroupList"
    ManagedRoomChunk:
      type: object
      description: A chunk representing a managed room.
      required: [room_id, de.famedly.managedRoom]
      properties:
        room_id:
          type: string
        name:
          type: string
        topic:
          type: string
        canonical_alias:
          type: string
        num_joined_members:
          type: integer
        avatar_url:
          type: string
        world_readable:
          type: boolean
        guest_can_join:
          type: boolean
        de.famedly.managedRoom:
          type: object
          required: [groups]
          properties:
            groups:
              type: array
              items:
                type: string
          description: The managed room metadata containing assigned groups.
    JoinLeaveErrors:
      type: object
      description: Information on errors that occurred while changing membership in a room.
      properties:
        join_errors:
          type: object
          additionalProperties:
            type: string
          example:
            "@alice:myserver.com": "User does not exist on this server"
        leave_errors:
          type: object
          additionalProperties:
            type: string
          example:
            "@charlie:myserver.com": "Failed to remove user from room"
    GroupList:
      type: array
      description: A list of group IDs
      items:
        type: string
      example: ["group1", "bobs_group"]
